<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chord Garden — Specimen</title>
  <style>
    :root {
      --blue: #eee2ca;   /* warm newsprint field */
      --paper: #241b16;  /* brown-black ink */
      --acid: #d9431a;   /* vermilion highlight */
      --ink: #241b16;
      --serif: Didot, "Bodoni 72", "Playfair Display", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--blue);
      color: var(--paper);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 10px 10px auto auto;
      width: 10px;
      height: 10px;
      border: 1px solid var(--paper);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--blue), 0 0 0 5px var(--paper);
      z-index: 10;
      pointer-events: none;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--acid); outline-offset: 3px; }

    /* ── masthead ── */
    @keyframes tick { to { transform: translateX(-50%); } }
    .masthead { position: relative; padding: 22px clamp(16px, 4vw, 56px) 0; }
    .edition-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 8px;
      border-bottom: 1px solid #00000055;
      padding-bottom: 5px;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 700 clamp(52px, 12vw, 160px)/.84 var(--serif);
      letter-spacing: -.03em;
      text-transform: uppercase;
    }
    h1 .thin { font-weight: 400; font-style: italic; letter-spacing: -.02em; }
    .setline {
      display: flex;
      align-items: baseline;
      gap: 18px;
      flex-wrap: wrap;
      margin: 18px 0 8px;
      border-bottom: 4px solid var(--paper);
      padding-bottom: 14px;
    }
    .setline .no { font-size: clamp(22px, 4vw, 40px); font-weight: 800; color: var(--acid); }
    #setSelect {
      appearance: none; -webkit-appearance: none;
      background: transparent;
      color: var(--paper);
      border: 0;
      border-bottom: 2px dashed #00000088;
      font: italic 400 clamp(18px, 3vw, 30px)/1.2 var(--serif);
      padding: 0 4px 2px;
      max-width: 70vw;
      cursor: pointer;
    }
    #setSelect option { color: var(--ink); font-style: normal; }
    .setline .arrows button { font-size: clamp(20px, 3vw, 30px); padding: 0 8px; }
    .setline .arrows button:hover { color: var(--acid); }
    .genre-index {
      display: flex;
      align-items: baseline;
      gap: 8px 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid #00000055;
      padding: 7px 0 9px;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .genre-index .legend { margin-right: 4px; color: #00000080; }
    .genre-index button { border-bottom: 1px solid transparent; }
    .genre-index button:hover, .genre-index button.on { color: var(--acid); border-color: currentColor; }
    #randomSet { margin-left: auto; font-weight: 800; }

    /* ── the specimen sheet ── */
    .sheet {
      display: grid;
      grid-template-columns: 1fr minmax(230px, 300px);
      gap: 0 clamp(16px, 3vw, 44px);
      padding: 0 clamp(16px, 4vw, 56px) 90px;
      align-items: start;
    }
    .rows { border-top: 1px solid #00000044; }
    .row {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: clamp(10px, 2vw, 26px);
      width: 100%;
      text-align: left;
      border-bottom: 1px solid #00000044;
      padding: .12em 4px .1em;
      overflow: hidden;
      transition: background .15s, color .15s;
    }
    .row .idx {
      flex: 0 0 auto;
      font-size: 10px;
      letter-spacing: .2em;
      color: #00000059;
      transform: translateY(-.9em);
    }
    .row.playing .idx { color: #0a0a1499; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    .rows.enter .row { animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards; }
    .row .key {
      flex: 0 0 2.2em;
      font-size: clamp(11px, 1.4vw, 15px);
      letter-spacing: .2em;
      color: #00000096;
      transform: translateY(-.5em);
    }
    .row .name {
      font-family: var(--serif);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: .96;
      text-transform: none;
      white-space: nowrap;
    }
    .row.s .name  { font-size: clamp(26px, 3.6vw, 52px); font-weight: 400; font-style: italic; }
    .row.m .name  { font-size: clamp(30px, 4.6vw, 66px); font-weight: 400; }
    .row.l .name  { font-size: clamp(36px, 6vw, 88px); }
    .row.xl .name { font-size: clamp(42px, 7.6vw, 112px); }
    .row.xxl .name{ font-size: clamp(48px, 9.4vw, 138px); letter-spacing: -.055em; }
    .row:hover { background: #00000010; }
    .row:hover .name { font-style: italic; }
    .row.active .key { color: var(--acid); }
    .row.active::before {
      content: "▶";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--acid);
    }
    .row.playing { background: var(--acid); color: var(--ink); }
    .row.playing .key { color: var(--ink); }
    .row.playing::before { content: "■"; color: var(--ink); }
    .tape {
      position: absolute;
      inset: auto 0 0 0;
      display: none;
      white-space: nowrap;
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      padding-bottom: 3px;
      pointer-events: none;
    }
    .row.playing .tape { display: block; }
    .tape span { display: inline-block; animation: tick 9s linear infinite; }
    .row.playing .name { animation: press-in .25s ease-out both; }
    @keyframes press-in { from { letter-spacing: .035em; opacity: .45; } }

    /* ── typeset controls ── */
    .margin {
      position: sticky;
      top: 14px;
      display: grid;
      gap: 22px;
      border-left: 1px solid #00000055;
      padding: 16px 0 16px clamp(14px, 2vw, 24px);
      font-size: 14px;
    }
    .margin h4 {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: #00000096;
      font-weight: 500;
    }
    #symbol { font-size: clamp(28px, 2.6vw, 42px); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
    #notes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 12px;
      margin-top: 10px;
      border-top: 1px solid #00000044;
      font: italic 15px/1.45 var(--serif);
      color: #000000b8;
    }
    #notes span { display: flex; justify-content: space-between; border-bottom: 1px solid #00000033; padding: 2px 0; }
    #notes i { font: 9px/2.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #00000077; }
    #play { margin-top: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; border-bottom: 3px solid var(--acid); padding-bottom: 2px; }
    #play:hover { color: var(--acid); }
    .textlist { display: grid; gap: 6px; justify-items: start; }
    .textlist button { letter-spacing: .06em; text-transform: uppercase; color: #00000099; }
    .textlist button:hover { color: var(--paper); }
    .textlist button.on { color: var(--acid); font-weight: 800; }
    .textlist button.on::before { content: "● "; }
    .inline-list { display: flex; gap: 16px; }
    #waveform {
      appearance: none; -webkit-appearance: none;
      background: transparent; color: var(--paper);
      border: 0; border-bottom: 2px dashed #00000088;
      font: inherit; text-transform: uppercase; letter-spacing: .06em;
      padding-bottom: 2px; cursor: pointer;
    }
    #waveform option { color: var(--ink); }
    #download {
      justify-self: start;
      background: var(--paper);
      color: var(--blue);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 12px 18px;
    }
    #download:hover { background: var(--acid); color: var(--ink); }
    #download:disabled { opacity: .6; cursor: wait; }
    .hint { color: #00000080; font-size: 12px; font-style: italic; }
    .colophon {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      align-items: end;
      margin: 0 clamp(16px, 4vw, 56px) 28px;
      border-top: 4px solid var(--paper);
      padding-top: 10px;
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .colophon .folio { font: italic 32px/1 var(--serif); letter-spacing: -.04em; }
    .colophon span:last-child { text-align: right; }

    @media (max-width: 760px) {
      .sheet { grid-template-columns: 1fr; }
      .margin {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 5;
        background: var(--blue);
        border-left: 0;
        border-top: 2px solid var(--paper);
        display: grid;
        grid-template-columns: minmax(130px, 1.25fr) 1fr;
        align-items: start;
        gap: 10px 18px;
        padding: 10px 14px 12px;
        max-height: 40vh;
        overflow: auto;
        font-size: 13px;
      }
      .margin h4 { margin-bottom: 4px; }
      .margin .hint { display: none; }
      #symbol { font-size: 24px; }
      #notes { font-size: 13px; margin-top: 2px; }
      .textlist { display: flex; flex-wrap: wrap; gap: 8px 14px; }
      #download { padding: 9px 14px; }
      .margin .readout { grid-row: span 2; }
      .margin #download { align-self: end; }
      .rows { margin-bottom: 40vh; }
      .row .name { white-space: normal; }
      .genre-index { gap: 7px 12px; }
      #randomSet { margin-left: 0; }
      .colophon { margin-bottom: 42vh; grid-template-columns: 1fr auto; }
      .colophon span:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tape span { animation: none; }
      .rows.enter .row { animation: none; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="edition-line"><span>Harmonic specimens for the modern ear</span><span>Vol. I · 100 collections</span></div>
    <h1>Chord<span class="thin">Garden</span></h1>
    <div class="setline">
      <span class="no" id="setNo">001</span>
      <select id="setSelect" aria-label="Chord collection"></select>
      <span class="arrows">
        <button id="prevSet" aria-label="Previous collection">←</button>
        <button id="nextSet" aria-label="Next collection">→</button>
      </span>
    </div>
    <nav id="genreIndex" class="genre-index" aria-label="Collection index"></nav>
  </header>

  <main class="sheet">
    <div id="rows" class="rows" aria-label="Chords in this collection"></div>

    <aside class="margin">
      <div class="readout">
        <h4>Now set</h4>
        <div id="symbol"></div>
        <div id="notes" aria-live="polite"></div>
        <button id="play">Play ⏵</button>
      </div>
      <div>
        <h4>Voicing</h4>
        <div class="textlist" id="voicingList" role="radiogroup" aria-label="Voicing"></div>
      </div>
      <div>
        <h4>Octave</h4>
        <div class="textlist inline-list" id="octList" role="radiogroup" aria-label="Octave"></div>
      </div>
      <div>
        <h4>Wave</h4>
        <select id="waveform">
          <option value="sine">Sine</option>
          <option value="harmonic">Harmonic</option>
          <option value="triangle">Triangle</option>
          <option value="square">Square</option>
          <option value="sawtooth">Sawtooth</option>
          <option value="supersaw">Supersaw</option>
        </select>
      </div>
      <button id="download">Download .WAV ↓</button>
      <p class="hint">space = play/stop · ↑/↓ = step through keys</p>
    </aside>
  </main>

  <footer class="colophon">
    <span>Chord Garden · An index of sounding forms</span>
    <span class="folio">CG—001</span>
    <span>Set in display serif &amp; monospaced furniture · Audio rendered locally</span>
  </footer>

  <script src="chord_sets.js"></script>
  <script>
    const CHORD_SETS = CHORD_SET_DATA;
    const NOTE_INDEX = { C: 0, "C#": 1, DB: 1, D: 2, "D#": 3, EB: 3, E: 4,
      F: 5, "F#": 6, GB: 6, G: 7, "G#": 8, AB: 8, A: 9, "A#": 10, BB: 10, B: 11 };
    const NOTE_NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
    const SIZE_CYCLE = ["xxl", "m", "l", "s", "xl", "m", "s", "l", "m", "xl", "s", "l"];
    const $ = id => document.getElementById(id);
    const els = {
      set: $("setSelect"), setNo: $("setNo"), rows: $("rows"),
      symbol: $("symbol"), notes: $("notes"), play: $("play"), download: $("download"),
      voicingList: $("voicingList"), octList: $("octList"), waveform: $("waveform"),
      genreIndex: $("genreIndex")
    };
    const GENRE_GROUPS = {
      All: () => true,
      Pop: genre => /pop/i.test(genre),
      Jazz: genre => /jazz|bossa/i.test(genre),
      Dance: genre => /house|techno|trance|edm|synthwave/i.test(genre),
      Cinema: genre => /cinematic|new age/i.test(genre),
      Soul: genre => /soul|r&b|gospel|funk|lofi/i.test(genre),
      Classical: genre => /classical|trad/i.test(genre),
      Modern: genre => /modern|stack|utility/i.test(genre)
    };
    const state = { voicing: "original", octave: 0 };
    const VOICINGS = ["original", "close", "open", "drop2", "wide"];
    const OCTAVES = [["-1", "−1"], ["0", "0"], ["1", "+1"]];
    let selectedChord = 0;
    let liveContext;
    let activeVoice = null;
    let activeGenreGroup = "All";

    CHORD_SETS.forEach(set => {
      els.set.add(new Option(`${set.genre}`, set.num));
    });
    const hashSet = Number(new URLSearchParams(location.hash.slice(1)).get("set"));
    if (CHORD_SETS.some(set => set.num === hashSet)) els.set.value = hashSet;

    function currentSet() {
      return CHORD_SETS.find(set => set.num === Number(els.set.value));
    }
    function currentChord() {
      return currentSet().chords[selectedChord];
    }

    function noteToMidi(note) {
      const match = /^([A-Ga-g])(#|b)?(-?\d+)$/.exec(note.trim());
      if (!match) throw new Error(`Unrecognized note: ${note}`);
      const [, letter, accidental, octave] = match;
      const key = letter.toUpperCase() + (accidental === "b" ? "B" : accidental || "");
      return (Number(octave) + 1) * 12 + NOTE_INDEX[key];
    }

    function applyVoicing(source) {
      const notes = [...source].sort((a, b) => a - b);
      const mode = state.voicing;
      if (mode === "original") return source;
      const pitchClasses = [...new Set(notes.map(note => ((note % 12) + 12) % 12))];
      if (mode === "close") {
        const lowest = notes[0];
        return pitchClasses.map(pc => {
          let note = Math.floor(lowest / 12) * 12 + pc;
          while (note < lowest) note += 12;
          return note;
        }).sort((a, b) => a - b);
      }
      if (mode === "open") {
        const close = applyClose(notes);
        return close.map((note, i) => i > 0 && i % 2 ? note + 12 : note).sort((a, b) => a - b);
      }
      if (mode === "drop2") {
        if (notes.length < 3) return notes;
        notes[notes.length - 2] -= 12;
        return notes.sort((a, b) => a - b);
      }
      if (mode === "wide") {
        const close = applyClose(notes);
        return close.map((note, i) => note + Math.floor((i + 1) / 2) * 12).sort((a, b) => a - b);
      }
      return notes;
    }

    function applyClose(notes) {
      const sorted = [...notes].sort((a, b) => a - b);
      const pitchClasses = [...new Set(sorted.map(note => ((note % 12) + 12) % 12))];
      const lowest = sorted[0];
      return pitchClasses.map(pc => {
        let note = Math.floor(lowest / 12) * 12 + pc;
        while (note < lowest) note += 12;
        return note;
      }).sort((a, b) => a - b);
    }

    function midiNotes() {
      const original = currentChord().notes.map(noteToMidi);
      const shift = state.octave * 12;
      return applyVoicing(original).map(note => note + shift);
    }

    function midiName(midi) {
      return `${NOTE_NAMES[((midi % 12) + 12) % 12]}${Math.floor(midi / 12) - 1}`;
    }

    /* ---------- typographic rendering ---------- */
    function renderRows() {
      els.rows.replaceChildren();
      currentSet().chords.forEach((chord, index) => {
        const isSelected = index === selectedChord;
        const row = document.createElement("button");
        row.className = "row " + SIZE_CYCLE[index] +
          (isSelected ? " active" : "") +
          (isSelected && activeVoice ? " playing" : "");
        row.setAttribute("aria-pressed", Boolean(isSelected && activeVoice));
        const octaveLabel = state.octave > 0 ? `+${state.octave}` : state.octave;
        const tapeUnit = `${midiNotes().map(midiName).join(" — ")} · ${state.voicing} · octave ${octaveLabel} · ${els.waveform.value} — `;
        const tapeText = isSelected
          ? tapeUnit.repeat(6)
          : "";
        row.title = chord.notes.join(" ");
        row.style.animationDelay = `${index * 45}ms`;
        row.innerHTML =
          `<span class="idx">${String(index + 1).padStart(2, "0")}</span>` +
          `<span class="key">${chord.key}</span>` +
          `<span class="name">${chord.name}</span>` +
          `<span class="tape" aria-hidden="true"><span>${tapeText}</span></span>`;
        row.addEventListener("click", () => {
          if (index === selectedChord && activeVoice) {
            stop();
            return;
          }
          stop(false);
          selectedChord = index;
          update();
          start();
        });
        els.rows.append(row);
      });
    }

    function renderTicker() {
      const set = currentSet();
      els.setNo.textContent = String(set.num).padStart(3, "0");
      document.querySelector(".folio").textContent = `CG—${String(set.num).padStart(3, "0")}`;
    }

    function updateReadout() {
      els.symbol.textContent = currentChord().name;
      els.notes.innerHTML = midiNotes().map((note, index) =>
        `<span><i>${String(index + 1).padStart(2, "0")}</i>${midiName(note)}</span>`
      ).join("");
      els.play.textContent = activeVoice ? "Stop ■" : "Play ⏵";
    }

    function update() {
      renderRows();
      updateReadout();
    }

    function renderControls() {
      els.voicingList.replaceChildren();
      VOICINGS.forEach(mode => {
        const button = document.createElement("button");
        button.className = state.voicing === mode ? "on" : "";
        button.textContent = mode === "drop2" ? "Drop 2" : mode;
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", state.voicing === mode);
        button.addEventListener("click", () => {
          state.voicing = mode;
          const wasPlaying = Boolean(activeVoice);
          if (wasPlaying) stop();
          renderControls();
          update();
          if (wasPlaying) start();
        });
        els.voicingList.append(button);
      });
      els.octList.replaceChildren();
      OCTAVES.forEach(([value, label]) => {
        const button = document.createElement("button");
        button.className = state.octave === Number(value) ? "on" : "";
        button.textContent = label;
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", state.octave === Number(value));
        button.addEventListener("click", () => {
          state.octave = Number(value);
          stop();
          renderControls();
          update();
        });
        els.octList.append(button);
      });
    }

    function renderGenreIndex() {
      els.genreIndex.replaceChildren();
      const legend = document.createElement("span");
      legend.className = "legend";
      legend.textContent = "Index";
      els.genreIndex.append(legend);
      Object.entries(GENRE_GROUPS).forEach(([label, matches]) => {
        const button = document.createElement("button");
        button.textContent = label;
        button.className = label === activeGenreGroup ? "on" : "";
        button.addEventListener("click", () => {
          const candidates = CHORD_SETS.map((set, index) => ({ set, index }))
            .filter(({ set }) => matches(set.genre));
          const next = candidates.find(({ index }) => index > els.set.selectedIndex) || candidates[0];
          activeGenreGroup = label;
          selectSet(next.index);
        });
        els.genreIndex.append(button);
      });
      const random = document.createElement("button");
      random.id = "randomSet";
      random.textContent = "Shuffle ↝";
      random.addEventListener("click", () => {
        let index = els.set.selectedIndex;
        while (CHORD_SETS.length > 1 && index === els.set.selectedIndex) {
          index = Math.floor(Math.random() * CHORD_SETS.length);
        }
        activeGenreGroup = "All";
        selectSet(index);
      });
      els.genreIndex.append(random);
    }

    function rememberSet() {
      history.replaceState(null, "", `#set=${currentSet().num}`);
    }

    /* ---------- audio engine (reference implementation, unchanged behavior) ---------- */
    function oscillatorLayers() {
      if (els.waveform.value === "harmonic") {
        return [
          { type: "sine", multiple: 1, level: 1 },
          { type: "sine", multiple: 2, level: .3 },
          { type: "sine", multiple: 3, level: .15 }
        ];
      }
      if (els.waveform.value === "supersaw") {
        return [-18, -12, -6, 0, 6, 12, 18].map(detune =>
          ({ type: "sawtooth", multiple: 1, detune, level: 1 })
        );
      }
      return [{ type: els.waveform.value, multiple: 1, detune: 0, level: 1 }];
    }

    function createVoice(context, destination, midi, start) {
      const fundamental = 440 * 2 ** ((midi - 69) / 12);
      const layers = oscillatorLayers();
      const totalLevel = layers.reduce((sum, layer) => sum + layer.level, 0);
      return layers.map(layer => {
        const oscillator = context.createOscillator();
        const layerGain = context.createGain();
        oscillator.type = layer.type;
        oscillator.frequency.value = fundamental * layer.multiple;
        oscillator.detune.value = layer.detune || 0;
        layerGain.gain.value = layer.level / totalLevel;
        oscillator.connect(layerGain).connect(destination);
        oscillator.start(start);
        return oscillator;
      });
    }

    function buildChord(context, destination, start = 0) {
      const duration = 2.5;
      const attack = .025;
      const notes = midiNotes();
      const master = context.createGain();
      master.gain.setValueAtTime(.0001, start);
      master.gain.exponentialRampToValueAtTime(.72 / notes.length, start + attack);
      master.gain.setValueAtTime(.72 / notes.length, start + duration - .12);
      master.gain.exponentialRampToValueAtTime(.0001, start + duration);
      master.connect(destination);
      notes.forEach(midi => {
        createVoice(context, master, midi, start).forEach(oscillator => oscillator.stop(start + duration));
      });
    }

    async function start() {
      liveContext ||= new AudioContext();
      await liveContext.resume();
      if (activeVoice) stop(false);
      const now = liveContext.currentTime;
      const notes = midiNotes();
      const master = liveContext.createGain();
      const oscillators = [];
      master.gain.setValueAtTime(.0001, now);
      master.gain.exponentialRampToValueAtTime(.72 / notes.length, now + .025);
      master.connect(liveContext.destination);
      notes.forEach(midi => {
        oscillators.push(...createVoice(liveContext, master, midi, now));
      });
      activeVoice = { master, oscillators };
      update();
    }

    function stop(render = true) {
      if (!activeVoice || !liveContext) return;
      const now = liveContext.currentTime;
      const { master, oscillators } = activeVoice;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(.0001, master.gain.value), now);
      master.gain.exponentialRampToValueAtTime(.0001, now + .08);
      oscillators.forEach(oscillator => oscillator.stop(now + .085));
      activeVoice = null;
      if (render) update();
    }

    function togglePlayback() {
      if (activeVoice) stop();
      else start();
    }

    function toWav(buffer) {
      const frames = buffer.length;
      const array = new ArrayBuffer(44 + frames * 2);
      const view = new DataView(array);
      let offset = 0;
      const text = value => { for (const char of value) view.setUint8(offset++, char.charCodeAt(0)); };
      const u16 = value => { view.setUint16(offset, value, true); offset += 2; };
      const u32 = value => { view.setUint32(offset, value, true); offset += 4; };
      text("RIFF"); u32(36 + frames * 2); text("WAVE"); text("fmt "); u32(16);
      u16(1); u16(1); u32(buffer.sampleRate); u32(buffer.sampleRate * 2); u16(2); u16(16);
      text("data"); u32(frames * 2);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < frames; i++) {
        const sample = Math.max(-1, Math.min(1, channel[i]));
        view.setInt16(offset, sample < 0 ? sample * 32768 : sample * 32767, true);
        offset += 2;
      }
      return array;
    }

    async function download() {
      els.download.disabled = true;
      els.download.textContent = "Setting type…";
      const sampleRate = 44100;
      const context = new OfflineAudioContext(1, 2.5 * sampleRate, sampleRate);
      buildChord(context, context.destination);
      const rendered = await context.startRendering();
      const blob = new Blob([toWav(rendered)], { type: "audio/wav" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const safeName = currentChord().name.replaceAll("/", "-").replaceAll("#", "sharp");
      link.href = url;
      link.download = `${safeName}-${state.voicing}.wav`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      els.download.disabled = false;
      els.download.textContent = "Download .WAV ↓";
    }

    /* ---------- wiring ---------- */
    let enterTimer;
    function replayEntrance() {
      els.rows.classList.add("enter");
      clearTimeout(enterTimer);
      enterTimer = setTimeout(() => els.rows.classList.remove("enter"), 1000);
    }

    function selectSet(index) {
      stop(false);
      els.set.selectedIndex = (index + els.set.length) % els.set.length;
      selectedChord = 0;
      renderTicker();
      renderGenreIndex();
      replayEntrance();
      update();
      rememberSet();
    }

    els.set.addEventListener("input", () => {
      activeGenreGroup = "All";
      selectSet(els.set.selectedIndex);
    });
    $("prevSet").addEventListener("click", () => {
      activeGenreGroup = "All";
      selectSet(els.set.selectedIndex - 1);
    });
    $("nextSet").addEventListener("click", () => {
      activeGenreGroup = "All";
      selectSet(els.set.selectedIndex + 1);
    });
    els.waveform.addEventListener("input", () => {
      if (activeVoice) { stop(); start(); }
    });
    els.play.addEventListener("click", togglePlayback);
    els.download.addEventListener("click", download);
    document.addEventListener("keydown", event => {
      if (event.target.tagName === "SELECT") return;
      if (event.code === "Space" && !event.repeat) {
        event.preventDefault();
        togglePlayback();
      }
      if (event.code === "ArrowDown" || event.code === "ArrowUp") {
        event.preventDefault();
        const wasPlaying = Boolean(activeVoice);
        stop(false);
        selectedChord = (selectedChord + (event.code === "ArrowDown" ? 1 : 11)) % 12;
        update();
        if (wasPlaying) start();
      }
      if (event.code === "ArrowLeft" || event.code === "ArrowRight") {
        event.preventDefault();
        activeGenreGroup = "All";
        selectSet(els.set.selectedIndex + (event.code === "ArrowRight" ? 1 : -1));
      }
    });

    renderControls();
    renderTicker();
    renderGenreIndex();
    replayEntrance();
    update();
  </script>
</body>
</html>
